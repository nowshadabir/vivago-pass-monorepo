<!-- Passkey Sign-in Modal -->
<div id="passkey-modal" class="passkey-modal hidden">
  <div class="passkey-modal-backdrop"></div>
  
  <div class="passkey-modal-content">
    <!-- Header -->
    <div class="passkey-modal-header">
      <div class="passkey-modal-title-group">
        <div class="passkey-modal-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/>
            <path d="M12 6v6m3-3H9"/>
          </svg>
        </div>
        <h2 class="passkey-modal-title">Passkey sign-in</h2>
      </div>
      <button id="passkey-close-btn" class="passkey-close-btn" aria-label="Close passkey modal">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <!-- Description -->
    <p class="passkey-modal-description">Choose a saved passkey to sign-in to localhost</p>

    <!-- Passkeys List -->
    <div class="passkey-list">
      <!-- Passkeys will be dynamically inserted here -->
    </div>

    <!-- Footer Note -->
    <p class="passkey-modal-footer">Close this window in order to use a security key or another passkey.</p>
  </div>
</div>
